app-id: de.sesu8642.feudaltactics
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: feudaltactics
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --env=PATH=/app/bin:/app/jre/bin:/usr/bin
  - --persist=.prefs
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh

  - name: feudaltactics
    buildsystem: simple
    build-commands:
      - install -D feudaltactics-wrapper.sh /app/bin/feudaltactics
      - install -D FeudalTactics-desktop.jar -t /app/data/
      - install -D source/appstream/${FLATPAK_ID}.appdata.xml -t /app/share/metainfo/
      - install -D source/appstream/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -D source/graphics/square_logo_512.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
    sources:
      - type: file
        path: feudaltactics-wrapper.sh
      - type: file
        url: https://github.com/Sesu8642/FeudalTactics/releases/download/v1.5.1/FeudalTactics-desktop.jar
        sha256: b10e0b081ff6ddfca04c2754a38aff7914c5d08da785157dee755e9b6590f898
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Sesu8642/FeudalTactics/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="FeudalTactics-desktop.jar") | .browser_download_url
      - type: archive
        url: https://api.github.com/repos/Sesu8642/FeudalTactics/tarball/v1.5.1
        sha256: 844915f7915be96965b572dcac42030cbafc99f6d605169f3255fd72aefd15c0
        archive-type: tar-gzip
        dest: source/
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Sesu8642/FeudalTactics/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .tarball_url
